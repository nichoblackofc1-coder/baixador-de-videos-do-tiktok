  <path d="M91 71C91 69.895 91.895 69 93 69C94.105 69 95 69.895 95 71V90.8L99.65 86.15C100.43 85.37 101.7 85.37 102.48 86.15C103.26 86.93 103.26 88.2 102.48 88.98L94.41 97.05C93.63 97.83 92.37 97.83 91.59 97.05L83.52 88.98C82.74 88.2 82.74 86.93 83.52 86.15C84.3 85.37 85.57 85.37 86.35 86.15L91 90.8V71Z" fill="#0284C7" />
  
  <!-- Tray / Bracket -->
  <path d="M78 98C78 96.895 78.895 96 80 96C81.105 96 82 96.895 82 98V103H104V98C104 96.895 104.895 96 106 96C107.105 96 108 96.895 108 98V104.5C108 106.433 106.433 108 104.5 108H79.5C77.567 108 76 106.433 76 104.5V98C76 96.895 76.895 96 78 96Z" fill="#0284C7" />
