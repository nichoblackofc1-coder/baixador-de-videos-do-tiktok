  <g filter="url(#triShadow)">
    <path d="M68 53.5C64.686 51.587 60.5 53.98 60.5 57.81V122.19C60.5 126.02 64.686 128.413 68 126.5L123.74 94.31C127.054 92.397 127.054 87.603 123.74 85.69L68 53.5Z" fill="#FFFFFF" />
  </g>

  <!-- Download Arrow & Tray (Cobalt Blue) -->
