<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="20" y1="10" x2="160" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="40%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#004ae6" />
    </linearGradient>

    <!-- Overlay Light Arc -->
    <linearGradient id="arcGrad" x1="30" y1="20" x2="150" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2" />
    </linearGradient>

    <!-- Triangle Drop Shadow -->
    <filter id="triShadow" x="30" y="30" width="120" height="120" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#002b80" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="180" height="180" rx="42" fill="url(#bgGrad)" />

  <!-- Wave Accent Overlay -->
  <path d="M0 42C0 18.804 18.804 0 42 0H138C161.196 0 180 18.804 180 42V85C145 75 105 90 70 125C38 156 18 175 0 180V42Z" fill="url(#arcGrad)" opacity="0.4" />

